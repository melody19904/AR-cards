name: Validate Repository

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail on obvious committed secrets
        run: |
          set -e
          echo "Scanning tracked files for JWTs and hardcoded Supabase/API keys..."

          # Supabase/Firebase-style JWTs (header always starts eyJ)
          if grep -rEn "eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}" \
              --exclude-dir=.git --exclude=*.lock .; then
            echo "::error::Found what looks like a JWT (service_role key or similar) committed in plaintext."
            exit 1
          fi

          # Hardcoded assignment patterns, e.g. SUPABASE_KEY = "..."
          if grep -rEn "(SUPABASE_(SERVICE_)?KEY|API_KEY|SECRET_KEY)\s*=\s*[\"'][A-Za-z0-9_\-\.]{20,}[\"']" \
              --exclude-dir=.git --exclude=*.lock --exclude=.env.example .; then
            echo "::error::Found a hardcoded key/secret assignment. Load it from the environment instead."
            exit 1
          fi

          echo "No obvious hardcoded secrets found."

  structure-check:
    name: Check referenced files exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify README-referenced assets are present
        run: |
          set -e
          missing=0
          for f in \
            "docs/media/Home.jpg" \
            "docs/media/Scan.jpg" \
            "docs/media/Vault.jpg" \
            "docs/media/settings.jpg" \
            "docs/media/Blue Omelett.jpg" \
            "CONTRIBUTING.md" \
            "SECURITY.md" \
            "CODE_OF_CONDUCT.md"; do
            if [ ! -f "$f" ]; then
              echo "::warning::Missing file referenced by README: $f"
              missing=1
            fi
          done
          exit 0  # warn, don't fail the build over missing docs/media

  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check server Python files
        run: |
          set -e
          files=$(find server -name "*.py" -not -path "*/.venv/*")
          if [ -z "$files" ]; then
            echo "No Python files found under server/ — nothing to check."
            exit 0
          fi
          echo "$files" | xargs -r python -m py_compile
